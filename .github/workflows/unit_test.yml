on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  run_unit_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          pip install --upgrade pip
          pip install pandas matplotlib numpy tqdm

      - run: |
          python test/test_utils.py

  run_func_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          pip install --upgrade pip
          pip install pandas matplotlib numpy tqdm

      - run: |
          bash test/test.sh